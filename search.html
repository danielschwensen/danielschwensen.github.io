<p>Search posts by title, content, date, category, or tag.</p>
<p>Try PowerShell, AWS, or a date such as 2026-10-06.</p>
<label for="search-input" style="display: block; margin-bottom: 8px;">Search posts</label>
<input type="text" id="search-input" placeholder="Search posts..." autofocus
  style="padding: 8px 12px; border-radius: 4px; border: 1px solid #ccc; width: 100%; max-width: 400px; margin-bottom: 20px;">
<div id="search-results">
</div>

<!-- Simple-Jekyll-Search: Search function for the search page -->
<script src="https://unpkg.com/simple-jekyll-search@1.10.0/dest/simple-jekyll-search.min.js"></script>
<script>
  (function () {
    function getQueryParam(param) {
      var urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(param);
    }

    var query = getQueryParam('q');
    var resultsContainer = document.getElementById('search-results');
    var input = document.getElementById('search-input');

    // Set input value immediately if we have a query
    if (query) {
      input.value = query;
    }

    // Load the index before initializing search and running the first query.
    fetch('/search.json')
      .then(function (response) {
        if (!response.ok) {
          throw new Error('Failed to load search index: HTTP ' + response.status);
        }
        return response.json();
      })
      .then(function (data) {
        if (!Array.isArray(data)) {
          throw new Error('Search index must be an array.');
        }

        var search = SimpleJekyllSearch({
          searchInput: input,
          resultsContainer: resultsContainer,
          json: data,
          searchResultTemplate: '<div style="margin-bottom:16px;"><a href="{url}" style="font-size:1.2em;color:#007acc;">{title}</a><br><span style="color:#555;">{date}</span></div>',
          noResultsText: '<p>No results found.</p>',
          limit: 50,
          fuzzy: false
        });

        // Use the current value in case the visitor typed while loading.
        if (input.value) {
          search.search(input.value);
        }
      })
      .catch(function (error) {
        resultsContainer.textContent = 'Search could not be loaded. Please reload the page to try again.';
        resultsContainer.setAttribute('role', 'alert');
        console.error('Search initialization failed:', error);
      });
  })();
</script>
